name: nas
services:

  postgres-db:
    image: postgres:18-alpine3.23
    restart: unless-stopped
    shm_size: 128mb #shared memory limit
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/data
    volumes:
      - postgres-data:/var/lib/postgresql/18/data
      - ./postgres-db/init:/docker-entrypoint-initdb.d  # init/schema.sql
    #ports:
    #  - "5432:5432"
    networks:
      - nas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend #build from Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy  #wait for db to be ready
    volumes:
      - ${STORAGE_PATH}:/app/storage #- /path/to/ssd:/app/storage
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 3000 #inside the container, accessible within the docker network
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ADMIN_SECRET: ${ADMIN_SECRET}
      SECURE_COOKIES: ${SECURE_COOKIES}
    #ports:
    #  - "3000:3000"
    networks:
      - nas

  nginx:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro #ro = read only
    #ports: defined in override file
    networks:
      - nas

volumes:
  postgres-data:

networks:
  nas:


