server {
	listen 80;
	server_name localhost;  #TODO: add personal domain

	#API routes
	location /api { #any request starting with /api
		proxy_pass http://backend:3000; #is forwarded here (internal docker network)
		
		proxy_http_version 1.1; #HTTP/1.1 protocol supports keep-alive connections (more efficient)
		#these next two lines enable WebSocket support (real-time connections)
		#if client sends "Upgrade: websocket", pass it to backend
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';

		proxy_set_header Host $host;#send original Host header to backend ("localhost" or domain) so backend can see what domain the user requested
		proxy_set_header X-Real-IP $remote_addr; #send the actual client's IP address to backend, without this backend would only see nginx's IP (172.x.x.x)
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; #create a chain of IPs if request went through multiple proxies. Format: "client_ip, proxy1_ip, proxy2_ip"
		proxy_set_header X-Forwarded-Proto $scheme; # Tell backend if original request was HTTP or HTTPS
		proxy_cache_bypass $http_upgrade; # Don't cache WebSocket upgrade requests
	}

	location / {
			#frontend
			proxy_pass http://host.docker.internal:5173;

			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_cache_bypass $http_upgrade;
	}
}